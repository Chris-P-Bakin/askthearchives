# Project name is distinct from every other stack on this host. Tailnet-only binds.
name: naca-observability
services:
  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996  # v3.5.0
    container_name: naca-obs-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "<TAILNET_IP>:9090:9090"
  grafana:
    image: grafana/grafana@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb  # 11.6.0
    container_name: naca-obs-grafana
    restart: unless-stopped
    env_file: .secrets/grafana.env        # GF_SECURITY_ADMIN_PASSWORD (gitignored, mode 600)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "<TAILNET_IP>:3000:3000"
    depends_on: [prometheus]
volumes:
  prom-data:
  grafana-data:
